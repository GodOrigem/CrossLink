# O que os membros de um grupo compartilham.
# O que passa de uma conta para a outra. Cada linha e independente:
# desligar uma faixa deixa aquela parte separada em cada conta.
sync:
  inventory: true      # as 36 posicoes da mochila
  armor: true          # os 4 slots de armadura
  offhand: true        # a mao secundaria
  ender-chest: true
  xp: true             # nivel, progresso e total

  # Pets (lobo, gato, cavalo, papagaio) passam a reconhecer a conta que estiver
  # online. Um pet so tem um dono, entao a troca so acontece quando ha apenas
  # um membro do grupo online.
  pets: true

  # Vida e fome vem DESLIGADOS de proposito.
  # Com health: true, dano em um aparece no outro na hora -- e morte mata os dois.
  health: false
  food: false

safety:
  # Ao sair, a conta secundaria fica com a playerdata vazia.
  # Sem isso os itens existiriam em dois arquivos de jogador ao mesmo tempo, e
  # bastaria remover o plugin pra cada conta acordar com uma copia -- duplicando
  # tudo. Com isso ligado, remover o plugin deixa exatamente um dono: a primaria.
  clear-secondary-on-quit: true

  # Retratos guardados antes de cada escrita destrutiva, por jogador.
  # Restaure com /plink restore <jogador>.
  backups-to-keep: 10

link:
  # Mostra o formulario nativo do Bedrock no primeiro login de cada conta.
  # Aparece UMA VEZ por conta: quem recusar so consegue de novo via /link.
  prompt-on-first-join: true

  # Espera antes de abrir o formulario, pro jogador terminar de carregar o mundo.
  prompt-delay-ticks: 60

  # Validade do codigo de confirmacao.
  code-timeout-seconds: 300

  # Copia a skin da conta Java pra conta Bedrock ao vincular.
  copy-java-skin: true

  # Reaplica a skin toda vez que a conta Bedrock entra. Sem isso ela se perde
  # no primeiro relogin, porque o Geyser aplica a skin do Bedrock no login.
  reapply-skin-on-join: true

  # Atraso antes de aplicar, para entrar depois do Geyser.
  skin-apply-delay-ticks: 40

  # Quem manda na skin:
  #   auto  -> se o SkinsRestorer estiver instalado, sai da frente e deixa com ele
  #   native -> aplica sempre, mesmo com SkinsRestorer presente (pode conflitar)
  skin-provider: auto

# Varredura de seguranca: pega mudanca que nenhum evento viu.
# 20 ticks = 1 segundo.
sweep-interval-ticks: 20

# De quanto em quanto tempo grava no disco (6000 ticks = 5 min).
save-interval-ticks: 6000
