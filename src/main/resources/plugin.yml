name: CrossLink
version: '1.0.0'
main: br.origem.crosslink.CrossLinkPlugin
api-version: '1.21'
description: Link a Bedrock and a Java account into one character - shared inventory, ender chest, XP, pets and skin, even with both online.
author: Origem
softdepend: [floodgate]

commands:
  link:
    description: Link your account to another one (self-service).
    usage: /link [name|code|status]
  crosslink:
    description: Manage linked account groups.
    usage: /crosslink
    permission: crosslink.admin
    aliases: [clink, plink]

permissions:
  crosslink.admin:
    description: Manage links for any player.
    default: op
