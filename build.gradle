plugins {
    id 'java'
}

group = 'br.origem'
version = '1.1.0-beta.3'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.opencollab.dev/maven-snapshots/' }
    maven { url = 'https://repo.opencollab.dev/maven-releases/' }
}

dependencies {
    // Casa com o build exato do servidor (Paper 26.2 build 123)
    // Spigot API 1.18.2: o menor denominador comum do alcance suportado.
    // Compilar contra ela e o que impede usar por acidente algo que so existe
    // no Paper ou em versao mais nova.
    compileOnly 'org.spigotmc:spigot-api:1.18.2-R0.1-SNAPSHOT'

    // Floodgate: detecta jogador Bedrock e envia formulario nativo.
    // compileOnly -- nao vai no jar, o servidor ja tem.
    compileOnly 'org.geysermc.floodgate:api:2.2.5-SNAPSHOT'
    compileOnly 'org.geysermc.cumulus:cumulus:1.1.2-SNAPSHOT'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    // Bytecode Java 17: roda de 1.18 (Java 17) ate 26.2 (Java 25).
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveFileName = "CrossLink-${version}.jar"
}
